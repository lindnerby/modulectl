name: Lint PR Title
run-name: ${{github.event.pull_request.title}}

permissions: { }

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  lint:
    name: Lint PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            chore
            deps
            docs
            feat
            fix
            refactor
            test
          requireScope: false
          # https://regex101.com/r/YybDgS/1
          subjectPattern: ^([A-Z].*[^.]|bump .*)$
